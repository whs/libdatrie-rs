[package]
name = "datrie"
version = "1.0.0"
edition = "2021"
license = "LGPL-2.1-or-later"
repository = "https://github.com/whs/libdatrie-rs"

[features]
default = ["capi"]
capi = ["std", "dep:libc", "dep:sentinel", "dep:cstream", "sentinel/libc"]
std = ["byteorder/std", "arrayvec/std"]
ctest = ["capi"]
bin = ["std", "dep:clap", "clap/derive", "dep:regex", "dep:iconv"]

[[bin]]
name = "trietool"
required-features = ["bin", "capi"]

[dependencies]
libc = { version = "0.2", optional = true }
byteorder = { version = "1", default-features = false }
cstream = { version = "0.1.4", optional = true }
rangemap = "1.8.0"
arrayvec = { version = "0.7.8", default-features = false }
clap = { version = "4.6.7", optional = true }
regex = { version = "1.13.1", optional = true }
iconv = { version = "0.1.1", optional = true }
sentinel = {  version = "0.5.4", optional = true }

[dev-dependencies]
serial_test = "4.0.1"
inline-c = "0.1.8"

[package.metadata.capi]
min_version = "0.10.26"

[package.metadata.capi.library]
name = "datrie"
version = "1.4.1"
version_suffix_components = 1

[package.metadata.capi.library.target.'cfg(target_os = "linux")']
rustflags = "-Clink-arg=-Wl,--version-script=libdatrie.map"

[package.metadata.capi.header]
name = "trie.h"
subdirectory = "datrie"
emit_version_constants = false

[package.metadata.capi.pkg_config]
name = "datrie"
filename = "datrie-0.2"
description = "Double-array trie library"
strip_include_path_components = 1

[profile.release-debug]
inherits = "release"
debug = true
strip = "none"
